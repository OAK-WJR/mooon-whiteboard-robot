; WhiteBoardBot - ESP32 固件
; https://docs.platformio.org/en/latest/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; micro-ROS 配置
board_microros_distro = humble
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; clangd 支持
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; ESP32 固件 - WiFi UDP transport (macOS Docker 推荐)
; 用法: pio run -e esp32wifi -t upload
; 需要先修改 config.h 中的 WIFI_SSID / WIFI_PASS / AGENT_IP
; ============================================================
[env:esp32wifi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MICRO_ROS_TRANSPORT_WIFI
board_microros_distro = humble
board_microros_transport = wifi
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; 单电机硬件测试 (ESP32 + TB6612 + 编码器)
; 用法: pio run -e motor_test -t upload && pio device monitor
; ============================================================
[env:motor_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MOTOR_TEST_MODE
build_src_filter =
    +<motor_test_main.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
    -<main.cpp>
    -<odometry.cpp>
; 不需要 micro-ROS
lib_deps =

; ============================================================
; ESP32 自主控制 (WiFi UDP, 无 ROS)
; 用法: pio run -e esp32auto -t upload
; ESP32 自己做路径规划+循线+PID, Mac 只发目标区域和位置
; ============================================================
[env:esp32auto]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D AUTO_MODE
build_src_filter =
    +<main_auto.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
    +<odometry.cpp>
    +<wifi_comm.cpp>
    +<path_planner.cpp>
    +<trajectory_follower.cpp>
    +<robot_controller.cpp>
    -<main.cpp>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; ============================================================
; Native 模拟测试 (桌面运行, 无需硬件)
; 测试: 运动学 / PID / 里程计 / 全链路模拟
; 用法: pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src
    -D NATIVE_TEST
; 不编译 src/ 下的文件, 测试文件自行 include 需要的源码
build_src_filter =
    -<*>

; WhiteBoardBot - ESP32 固件
; 三轮全向轮白板机器人 · 无 ROS, ESP32 自主控制
; https://docs.platformio.org/en/latest/projectconf.html

[platformio]
default_envs = esp32

; ============================================================
; 主固件 — ESP32 自主控制 (WiFi UDP, 无 ROS)
;   ESP32 自己做路径规划 + 循线 + FF/PID, 上位机只发目标区域和位置校正。
;   串口可在运行时实时调参 (PID/速度/前瞻), 见 main.cpp 顶部命令表。
; 用法: pio run -e esp32 -t upload && pio device monitor
; 需先: cp include/config.example.h include/config.h 并填入 WiFi
; ============================================================
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; 单/三电机硬件测试台 (ESP32 + RZ7899 + 编码器)
;   开环 / PID 闭环 / 运动学, 串口交互。配合 scripts/pid_tuner.py 做 PID 标定。
; 用法: pio run -e motor_test -t upload && pio device monitor
; ============================================================
[env:motor_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MOTOR_TEST_MODE
build_src_filter =
    +<motor_test_main.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; Native 模拟测试 (桌面运行, 无需硬件)
;   运动学 / PID / 里程计 / 全链路模拟。测试文件自行 include 需要的源码。
; 用法: pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src
    -D NATIVE_TEST
build_src_filter =
    -<*>

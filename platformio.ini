; WhiteBoardBot - ESP32 固件
; 三轮全向轮白板机器人 · 无 ROS, ESP32 自主控制
; https://docs.platformio.org/en/latest/projectconf.html

[platformio]
default_envs = esp32
; 工具链 / 框架 / 库缓存全部放项目内 .platformio/, 与系统环境隔离。
; 删除整个项目目录即可彻底清理, 不污染 ~/.platformio。
core_dir = .platformio

; ============================================================
; 主固件 — ESP32 自主控制 (WiFi UDP, 无 ROS)
;   ESP32 自己做路径规划 + 循线 + FF/PID, 上位机只发目标区域和位置校正。
;   串口可在运行时实时调参 (PID/速度/前瞻), 见 main.cpp 顶部命令表。
; 用法: pio run -e esp32 -t upload && pio device monitor
; 需先: cp include/config.example.h include/config.h 并填入 WiFi
; ============================================================
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; 主固件 — ESP32-C6 版 (Waveshare C6-LCD-1.47 + 转接板 + 驱动底板)
;   与 [env:esp32] 同一份源码, 引脚/外设差异靠 config.h 里的
;   CONFIG_IDF_TARGET_ESP32C6 条件编译区分。
; 用法: ./.venv/bin/pio run -e c6 -t upload --upload-port /dev/cu.usbmodem101
; 注: 主 .venv 已于 2026-07-18 重建为 Python 3.13 (新版 platform-espressif32
;     要求 >=3.10, 旧的 3.9 环境连 esp32 版都编不了)。
; ============================================================
[env:c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; ============================================================
; 单/三电机硬件测试台 (ESP32 + RZ7899 + 编码器)
;   开环 / PID 闭环 / 运动学, 串口交互。配合 scripts/pid_tuner.py 做 PID 标定。
; 用法: pio run -e motor_test -t upload && pio device monitor
; ============================================================
[env:motor_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MOTOR_TEST_MODE
build_src_filter =
    +<motor_test_main.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; Native 模拟测试 (桌面运行, 无需硬件)
;   运动学 / PID / 里程计 / 全链路模拟。测试文件自行 include 需要的源码。
; 用法: pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src
    -D NATIVE_TEST
build_src_filter =
    -<*>

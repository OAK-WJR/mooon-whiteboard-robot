; WhiteBoardBot - ESP32 firmware
; Three-omni-wheel whiteboard robot · no ROS, ESP32 autonomous control
; https://docs.platformio.org/en/latest/projectconf.html

[platformio]
default_envs = esp32
; Toolchain / framework / library cache all live in the project's .platformio/, isolated from the system.
; Deleting the project folder cleans everything up; ~/.platformio is left untouched.
core_dir = .platformio

; ============================================================
; Main firmware — ESP32 autonomous control (WiFi UDP, no ROS)
;   The ESP32 does path planning + path following + FF/PID; the host PC only sends target areas and position corrections.
;   Serial allows live tuning at runtime (PID/speed/lookahead); see the command table at the top of main.cpp.
; Usage: pio run -e esp32 -t upload && pio device monitor
; First: cp include/config.example.h include/config.h and fill in WiFi
; ============================================================
[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; Main firmware — ESP32-C6 version (Waveshare C6-LCD-1.47 + adapter board + driver base board)
;   Same source as [env:esp32]; pin/peripheral differences are handled by
;   CONFIG_IDF_TARGET_ESP32C6 conditional compilation in config.h.
; Usage: ./.venv/bin/pio run -e c6 -t upload --upload-port /dev/cu.usbmodem101
; Note: the main .venv was rebuilt with Python 3.13 on 2026-07-18 (newer platform-espressif32
;     requires >=3.10; the old 3.9 environment could not even build the esp32 version).
; ============================================================
[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; ============================================================
; Single/three-motor hardware test bench (ESP32 + RZ7899 + encoders)
;   Open-loop / PID closed-loop / kinematics, interactive over serial. Use with scripts/pid_tuner.py for PID calibration.
; Usage: pio run -e motor_test -t upload && pio device monitor
; ============================================================
[env:motor_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MOTOR_TEST_MODE
build_src_filter =
    +<motor_test_main.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
extra_scripts = pre:.scripts/extra_compiledb.py

; Integrated C6 board: USB + Wi-Fi STA + BLE GATT, authenticated control.
; Power design is still unqualified; this build keeps every motion command locked.
; USB provisioning uses scripts/robot_control.py; legacy Wi-Fi credentials are not used.
[env:top_board_v2]
extends = env:c6
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    ${env:c6.build_flags}
    -DWBB_TOP_BOARD_V2=1

; R3 REVIEW ONLY: onboard C6 + CP2102N on UART0 RX17/TX16.
; GPIO12/13 are NC; GPIO21 is MOTOR_ARM_REQUEST, not a completed power gate.
; Neither three 6V nor three 12V motors is qualified. No charging or motion.
; Public defaults deliberately take precedence over stale private config.h pins.
[env:top_board_v2_r3]
extends = env:top_board_v2
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_R3=1
    -include include/r3_build_config.h
monitor_dtr = 0
monitor_rts = 0

; KISS C6 logic board (EasyEDA, 2026-10-29): ESP32-C6-MINI-1, native USB CDC console (no USB-UART bridge),
; on-board IP2326 2S charger. Review only: GPIO0 ARM stays LOW, no PWM modulation or charger control.
[env:top_board_v2_kiss_c6]
extends = env:top_board_v2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_KISS_C6=1
    -include include/kiss_c6_build_config.h
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
    -<wifi_comm.cpp>
lib_ldf_mode = chain+
monitor_dtr = 0
monitor_rts = 0

; Separate read-only UART/encoder/reset diagnostic. No motor driver, Wi-Fi,
; BLE, I2C/charger or PID implementation is linked into this environment.
[env:top_board_v2_r3_diag]
extends = env:top_board_v2_r3
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWBB_TOP_BOARD_V2=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_R3=1
    -DWBB_R3_DIAGNOSTIC=1
    -include include/r3_build_config.h
build_src_filter =
    -<*>
    +<main.cpp>
lib_deps =

; Explicit current fourteen-sheet Waveshare ESP32-S3-Pico-M electrical handoff.
; Generic S3 toolchain target only: application pins come from the public profile.
; Factory CH343P UART0 is the USB console; native USB pins stay reserved.
; PSRAM deliberately disabled pending module/runtime qualification.
[env:top_board_v2_pico]
platform = ${env:esp32.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_PICO=1
    -include include/pico_build_config.h
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
    -<wifi_comm.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; Evaluate the profile's preprocessor branches; never scan a legacy config.h.
lib_ldf_mode = chain+

; ============================================================
; Native simulation tests (run on the desktop, no hardware needed)
;   Kinematics / PID / odometry / full-chain simulation. The test file includes the sources it needs itself.
; Usage: pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src
    -D NATIVE_TEST
build_src_filter =
    -<*>

; WhiteBoardBot - ESP32 固件
; 三轮全向轮白板机器人 · 无 ROS, ESP32 自主控制
; https://docs.platformio.org/en/latest/projectconf.html

[platformio]
default_envs = esp32
; 工具链 / 框架 / 库缓存全部放项目内 .platformio/, 与系统环境隔离。
; 删除整个项目目录即可彻底清理, 不污染 ~/.platformio。
core_dir = .platformio

; ============================================================
; 主固件 — ESP32 自主控制 (WiFi UDP, 无 ROS)
;   ESP32 自己做路径规划 + 循线 + FF/PID, 上位机只发目标区域和位置校正。
;   串口可在运行时实时调参 (PID/速度/前瞻), 见 main.cpp 顶部命令表。
; 用法: pio run -e esp32 -t upload && pio device monitor
; 需先: cp include/config.example.h include/config.h 并填入 WiFi
; ============================================================
[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
extra_scripts = pre:.scripts/extra_compiledb.py

; ============================================================
; 主固件 — ESP32-C6 版 (Waveshare C6-LCD-1.47 + 转接板 + 驱动底板)
;   与 [env:esp32] 同一份源码, 引脚/外设差异靠 config.h 里的
;   CONFIG_IDF_TARGET_ESP32C6 条件编译区分。
; 用法: ./.venv/bin/pio run -e c6 -t upload --upload-port /dev/cu.usbmodem101
; 注: 主 .venv 已于 2026-07-18 重建为 Python 3.13 (新版 platform-espressif32
;     要求 >=3.10, 旧的 3.9 环境连 esp32 版都编不了)。
; ============================================================
[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; ============================================================
; 单/三电机硬件测试台 (ESP32 + RZ7899 + 编码器)
;   开环 / PID 闭环 / 运动学, 串口交互。配合 scripts/pid_tuner.py 做 PID 标定。
; 用法: pio run -e motor_test -t upload && pio device monitor
; ============================================================
[env:motor_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D MOTOR_TEST_MODE
build_src_filter =
    +<motor_test_main.cpp>
    +<motor_driver.cpp>
    +<kinematics.cpp>
    +<pid_controller.cpp>
extra_scripts = pre:.scripts/extra_compiledb.py

; Integrated C6 board: USB + Wi-Fi STA + BLE GATT, authenticated control.
; Power design is still unqualified; this build keeps every motion command locked.
; USB provisioning uses scripts/robot_control.py; legacy Wi-Fi credentials are not used.
[env:top_board_v2]
extends = env:c6
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    ${env:c6.build_flags}
    -DWBB_TOP_BOARD_V2=1

; R3 REVIEW ONLY: onboard C6 + CP2102N on UART0 RX17/TX16.
; GPIO12/13 are NC; GPIO21 is MOTOR_ARM_REQUEST, not a completed power gate.
; Neither three 6V nor three 12V motors is qualified. No charging or motion.
; Public defaults deliberately take precedence over stale private config.h pins.
[env:top_board_v2_r3]
extends = env:top_board_v2
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_R3=1
    -include include/r3_build_config.h
monitor_dtr = 0
monitor_rts = 0

; External-charge C6-MINI + CH343G, matching controller_core/logic.
; Review only: GPIO0 ARM stays LOW, no PWM modulation or charger control.
[env:top_board_v2_kiss_c6]
extends = env:top_board_v2
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_KISS_C6=1
    -include include/kiss_c6_build_config.h
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
    -<wifi_comm.cpp>
lib_ldf_mode = chain+
monitor_dtr = 0
monitor_rts = 0

; Separate read-only UART/encoder/reset diagnostic. No motor driver, Wi-Fi,
; BLE, I2C/charger or PID implementation is linked into this environment.
[env:top_board_v2_r3_diag]
extends = env:top_board_v2_r3
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWBB_TOP_BOARD_V2=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_R3=1
    -DWBB_R3_DIAGNOSTIC=1
    -include include/r3_build_config.h
build_src_filter =
    -<*>
    +<main.cpp>
lib_deps =

; Explicit current fourteen-sheet Waveshare ESP32-S3-Pico-M electrical handoff.
; Generic S3 toolchain target only: application pins come from the public profile.
; Factory CH343P UART0 is the USB console; native USB pins stay reserved.
; PSRAM deliberately disabled pending module/runtime qualification.
[env:top_board_v2_pico]
platform = ${env:esp32.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DWBB_TOP_BOARD_V2=1
    -DWBB_TOP_BOARD_PICO=1
    -include include/pico_build_config.h
build_src_filter =
    +<*>
    -<motor_test_main.cpp>
    -<wifi_comm.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
; Evaluate the profile's preprocessor branches; never scan a legacy config.h.
lib_ldf_mode = chain+

; ============================================================
; Native 模拟测试 (桌面运行, 无需硬件)
;   运动学 / PID / 里程计 / 全链路模拟。测试文件自行 include 需要的源码。
; 用法: pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I src
    -D NATIVE_TEST
build_src_filter =
    -<*>

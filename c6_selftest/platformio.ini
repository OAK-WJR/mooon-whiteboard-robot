; ESP32-C6 hardware self-test - separate environment, does not affect the main firmware (src/ is still the ESP32 version)
; Flash: cd c6_selftest && PLATFORMIO_CORE_DIR=../.platformio pio run -t upload
[env:c6selftest]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
; Serial goes over USB-Serial/JTAG (direct Type-C, does not use GPIO16/17)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

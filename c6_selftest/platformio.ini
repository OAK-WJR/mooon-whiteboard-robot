; ESP32-C6 硬件自检 — 独立环境, 不影响主固件 (src/ 仍是 ESP32 版)
; 烧录: cd c6_selftest && PLATFORMIO_CORE_DIR=../.platformio pio run -t upload
[env:c6selftest]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
; Serial 走 USB-Serial/JTAG (Type-C 直连, 不占 GPIO16/17)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

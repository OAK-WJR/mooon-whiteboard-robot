; ESP32-C6 motor + encoder test firmware (Waveshare ESP32-C6-LCD-1.47 plugged into the adapter board)
; Uses the pioarduino platform (official platformio does not support Arduino core 3.x for C6)
[platformio]
core_dir = ../.platformio

[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem2101
; Serial goes over USB-Serial-JTAG (does not use UART0=GPIO16/17; those two pins are the encoder!)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

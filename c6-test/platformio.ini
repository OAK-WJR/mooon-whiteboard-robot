; ESP32-C6 电机+编码器测试固件 (Waveshare ESP32-C6-LCD-1.47 插在转接板上)
; 用 pioarduino 平台 (官方 platformio 不支持 C6 的 Arduino core 3.x)
[platformio]
core_dir = ../.platformio

[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem2101
; Serial 走 USB-Serial-JTAG (不占 UART0=GPIO16/17, 那两脚是编码器!)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

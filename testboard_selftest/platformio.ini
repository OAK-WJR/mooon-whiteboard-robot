; test board (板载 ESP32-C6-MINI-1 + 1S LiPo + MT3608 升压) 硬件自检
; 烧录: .venv/bin/pio run -d testboard_selftest -t upload
[platformio]
core_dir = ../.platformio

[env:testboard]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

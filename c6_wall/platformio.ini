; Whiteboard firmware for the Waveshare ESP32-C6-LCD-1.47 + adapter + RZ7889 base.
; First install over USB:   pio run -t upload
; Every later update:       python tools/ota.py        (Wi-Fi, no USB)
[platformio]
core_dir = ../.platformio
default_envs = c6_wall

[env:c6_wall]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:tools/prebuild.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
